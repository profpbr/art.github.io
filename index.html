<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Applied Research Techniques - Course Page</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 0;
      background-color: #f9f9f9;
    }

    /* HEADER */
    .soc-header {
      display: grid;
      grid-template-columns: auto 1fr auto;
      align-items: center;
      padding: 18px 20px;
      background: #00AEEF;
      color: #fff;
      border-bottom: 4px solid #007AB3;
    }

    .soc-logo {
      height: 70px;
    }

    .soc-title {
      text-align: center;
    }

    .main-title {
      font-size: 1.8rem;
      font-weight: 700;
    }

    .sub-title {
      font-size: 1rem;
      margin-top: 4px;
    }

    .course-meta {
      margin-top: 8px;
      font-size: 0.95rem;
    }

    .course-meta span {
      margin-right: 15px;
      white-space: nowrap;
    }

    /* TABS */
    .tabs {
      display: flex;
      background: #333;
      overflow-x: auto;
    }

    .tabs button {
      background: none;
      border: none;
      color: #fff;
      padding: 14px 20px;
      cursor: pointer;
      font-size: 1em;
    }

    .tabs button:hover {
      background: #575757;
    }

    .tabs button.active {
      background: #00AEEF;
    }

    /* CONTENT */
    .tab-content {
      display: none;
      padding: 20px;
      background: #fff;
      min-height: 600px;
    }

    .tab-content.active {
      display: block;
    }

    iframe {
      width: 100%;
      height: 800px;
      border: none;
    }

    /* BUTTONS */
    .action-buttons {
      text-align: center;
      margin-top: 20px;
    }

    .action-buttons a {
      display: inline-block;
      margin: 8px;
      padding: 10px 20px;
      background: #00AEEF;
      color: #fff;
      text-decoration: none;
      border-radius: 5px;
    }

    .action-buttons a:hover {
      background: #007AB3;
    }

    /* FORM */
    form input, form textarea {
      width: 100%;
      padding: 8px;
      margin: 6px 0 12px;
      border: 1px solid #ccc;
      border-radius: 4px;
    }

    form button {
      padding: 10px 20px;
      background: #00AEEF;
      color: #fff;
      border: none;
      cursor: pointer;
    }

    form button:hover {
      background: #007AB3;
    }
  </style>
</head>

<body>

<!-- HEADER -->
<div class="soc-header">
  <img src="SOC Logo.png" alt="SOC Logo" class="soc-logo">
  <div class="soc-title">
    <div class="main-title">APPLIED RESEARCH TECHNIQUES</div>
    <div class="sub-title">School of Commerce – PG Studies</div>
    <div class="course-meta">
      <span><strong>Semester:</strong> I</span>
      <span><strong>Course Code:</strong> M.Com</span>
      <span><strong>Credits:</strong> 4</span>
      <span><strong>No. of Hours:</strong> 60</span>
    </div>
  </div>
</div>

<!-- TABS -->
<div class="tabs">
  <button class="tab-link active" data-tab="syllabus">Syllabus</button>
  <button class="tab-link" data-tab="tlep">TLEP</button>
  <button class="tab-link" data-tab="module1">Module 1</button>
  <button class="tab-link" data-tab="module2">Module 2</button>
  <button class="tab-link" data-tab="module3">Module 3</button>
  <button class="tab-link" data-tab="module4">Module 4</button>
  <button class="tab-link" data-tab="module5">Module 5</button>
  <button class="tab-link" data-tab="queries">Queries</button>
</div>

<!-- SYLLABUS -->
<div id="syllabus" class="tab-content active">
  <iframe src="syllabus.html"></iframe>
</div>

<!-- TLEP -->
<div id="tlep" class="tab-content">
  <iframe src="tlep.html"></iframe>
</div>

<!-- MODULE 1 -->
<div id="module1" class="tab-content">
  <iframe src="https://drive.google.com/file/d/1aKnvHJ6ek-HCDuuklXfxc6A4JLoQbx0Z/preview"></iframe>
</div>

<!-- MODULE 2 -->
<div id="module2" class="tab-content">
  <iframe src="https://drive.google.com/file/d/1Mr8NT5MH_mQDCLccIjb_97LhX_E9rYW3/preview"></iframe>
</div>

<!-- MODULE 3 -->
<div id="module3" class="tab-content">
  <iframe src="module3.pdf"></iframe>
  <div class="action-buttons">
    <a href="module3.pdf" download>Download Module 3</a>
  </div>
</div>

<!-- MODULE 4 -->
<div id="module4" class="tab-content">
  <iframe src="module4.pdf"></iframe>
  <div class="action-buttons">
    <a href="module4.pdf" download>Download Module 4</a>
  </div>
</div>

<!-- MODULE 5 -->
<div id="module5" class="tab-content">
  <p>Module 5 content coming soon.</p>
</div>

<!-- QUERIES -->
<div id="queries" class="tab-content">
  <h2>Submit Your Query</h2>
  <form action="https://formspree.io/f/xyznnljn" method="POST">
    <input type="text" name="name" placeholder="Name" required>
    <input type="email" name="_replyto" placeholder="Email" required>
    <textarea name="query" placeholder="Your query" required></textarea>
    <button type="submit">Submit</button>
  </form>
</div>

<!-- SCRIPT -->
<script>
  const tabs = document.querySelectorAll(".tab-link");
  const contents = document.querySelectorAll(".tab-content");

  tabs.forEach(tab => {
    tab.addEventListener("click", () => {
      tabs.forEach(t => t.classList.remove("active"));
      contents.forEach(c => c.classList.remove("active"));
      tab.classList.add("active");
      document.getElementById(tab.dataset.tab).classList.add("active");
    });
  });
</script>

</body>
</html>
